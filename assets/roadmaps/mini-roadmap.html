<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HootQuest Mini Roadmap</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070d13;
      --grid: rgba(120, 236, 255, 0.1);
      --major: rgba(120, 236, 255, 0.18);
      --cyan: #78ecff;
      --mint: #9cff58;
      --gold: #ffdc5c;
      --ink: #effcff;
      --muted: #9eb6bd;
      --panel: rgba(14, 19, 23, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .mini-roadmap {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto auto;
      align-content: center;
      width: 100vw;
      height: 100vh;
      min-height: 0;
      padding: 18px;
      background:
        radial-gradient(circle at 18% 30%, rgba(156, 255, 88, 0.13), transparent 18rem),
        radial-gradient(circle at 78% 48%, rgba(120, 236, 255, 0.12), transparent 20rem),
        linear-gradient(180deg, #111a21, #050910);
      isolation: isolate;
    }

    .mini-roadmap::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(var(--major) 1px, transparent 1px),
        linear-gradient(90deg, var(--major) 1px, transparent 1px);
      background-size: 18px 18px, 18px 18px, 72px 72px, 72px 72px;
      animation: gridDrift 32s linear infinite;
    }

    .brand-stage {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-height: 42px;
      margin: 0 0 8px;
      width: min(1120px, 100%);
    }

    .brand-mark {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(156, 255, 88, 0.7);
      border-radius: 50%;
      color: #071018;
      background: var(--mint);
      font-weight: 1000;
      letter-spacing: 0;
      box-shadow: 0 0 20px rgba(156, 255, 88, 0.38);
    }

    .brand-text {
      min-width: 0;
      color: var(--ink);
      font-size: clamp(1.05rem, 3.5vw, 1.65rem);
      font-weight: 900;
      letter-spacing: 0;
      text-shadow: 0 0 18px rgba(120, 236, 255, 0.25);
    }

    .typed-word {
      color: var(--gold);
    }

    .viewport {
      position: relative;
      overflow: hidden;
      width: min(1120px, 100%);
      height: 260px;
      margin: 0;
      border: 1px solid rgba(120, 236, 255, 0.16);
      background: rgba(0, 0, 0, 0.1);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.25);
    }

    .mini-shell {
      width: 1120px;
      transform-origin: top left;
      margin: 0;
    }

    .track {
      position: absolute;
      inset: 0 auto auto 0;
      width: 2680px;
      height: 260px;
      transform: translateX(0);
      transition: transform 650ms cubic-bezier(.2, .75, .18, 1);
    }

    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .spine {
      fill: none;
      stroke: rgba(239, 252, 255, 0.78);
      stroke-width: 3;
      stroke-linecap: round;
      filter: drop-shadow(0 0 7px rgba(239, 252, 255, 0.35));
    }

    .wire {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 1 12;
      opacity: 0;
      animation: wireFlow 2.2s linear infinite;
      filter: drop-shadow(0 0 6px currentColor);
      transition: opacity 450ms ease;
    }

    .wire.visible {
      opacity: 0.92;
    }

    .node {
      position: absolute;
      width: 180px;
      min-height: 76px;
      border: 1px solid rgba(120, 236, 255, 0.35);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.14), transparent 28px),
        var(--panel);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.2), 0 8px 18px rgba(0, 0, 0, 0.26);
      opacity: 0.3;
      transform: scale(0.9);
      transition: opacity 400ms ease, transform 450ms ease, border-color 350ms ease, box-shadow 350ms ease;
    }

    .node.revealed {
      opacity: 0.75;
    }

    .node.active {
      opacity: 1;
      transform: scale(1.05);
      border-color: var(--mint);
      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.24),
        0 0 24px rgba(156, 255, 88, 0.24),
        0 8px 18px rgba(0, 0, 0, 0.3);
    }

    .node.progress {
      border-color: var(--gold);
    }

    .node.locked {
      opacity: 0.38;
      border-style: dashed;
    }

    .node-title {
      display: flex;
      align-items: center;
      min-height: 26px;
      padding: 5px 10px;
      border-radius: 8px 8px 0 0;
      font-size: 0.72rem;
      font-weight: 1000;
      text-transform: uppercase;
      background: linear-gradient(90deg, rgba(120, 236, 255, 0.18), transparent);
    }

    .node-body {
      margin: 0;
      padding: 9px 10px 11px;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.3;
    }

    .seed-flash {
      position: absolute;
      left: 46px;
      top: 127px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 26px rgba(156, 255, 88, 0.9);
      transform: translate(-50%, -50%);
      animation: seedPulse 1.8s ease-in-out infinite;
    }

    @keyframes wireFlow {
      to {
        stroke-dashoffset: -52;
      }
    }

    @keyframes gridDrift {
      to {
        background-position: 36px 18px, 36px 18px, 72px 36px, 72px 36px;
      }
    }

    @keyframes seedPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(0.9);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.25);
      }
    }

    @media (max-width: 640px) {
      .mini-roadmap {
        padding: 14px;
      }

      .brand-stage,
      .viewport {
        width: 1120px;
      }
    }
  </style>
</head>
<body>
  <section class="mini-roadmap" aria-label="HootQuest miniature animated roadmap">
    <div class="mini-shell" id="miniShell">
      <div class="brand-stage">
        <span class="brand-mark" id="brandMark">PE</span>
        <span class="brand-text" id="brandText">Playforge Entertainment</span>
      </div>

      <div class="viewport" id="viewport">
        <div class="track" id="track">
          <div class="seed-flash" aria-hidden="true"></div>
          <svg viewBox="0 0 2680 260" preserveAspectRatio="none" aria-hidden="true">
            <path class="spine" d="M 46 130 H 2580" />
            <g id="wires"></g>
          </svg>
          <div id="nodes"></div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const nodes = [
      { id: "concept", x: 120, y: 42, title: "HootQuest Concept", body: "Cooperative woodland heroes, dice combat, and tactical tile movement.", status: "complete" },
      { id: "paper", x: 390, y: 150, title: "Paper Prototype", body: "Rough dungeon layouts, placeholder owls, and first turn rhythm.", status: "complete" },
      { id: "tiles", x: 660, y: 42, title: "Tile System Rework", body: "Movement balancing, enemy spacing, and cleaner tactical readability.", status: "complete" },
      { id: "manufacturing", x: 930, y: 150, title: "Miniature Production", body: "PLA tests, resin hybrid planning, and print-bed efficiency.", status: "current" },
      { id: "books", x: 1200, y: 42, title: "Rulebook & Campaigns", body: "V2 rulebook, combat examples, and campaign progression.", status: "current" },
      { id: "cardsloot", x: 1470, y: 42, title: "Action Deck & Artifacts", body: "45-card deck, status effects, persistent loot, and rewards.", status: "complete" },
      { id: "identity", x: 1740, y: 150, title: "Box Art & Website", body: "Visual identity, website presence, and campaign previews.", status: "milestone" },
      { id: "wearehere", x: 2010, y: 150, title: "We Are Here", body: "Website finish, Kickstarter prep, print setup, and tuning.", status: "progress" },
      { id: "community", x: 2280, y: 42, title: "Community & Demo Events", body: "Demos, feedback cycles, and early community building.", status: "current" },
      { id: "expansions", x: 2520, y: 150, title: "Expansion Roadmap", body: "Rat King, Skywatch, Wildwood, and Nightfall planning.", status: "locked" }
    ];

    const links = nodes.slice(0, -1).map((node, index) => ({ from: node.id, to: nodes[index + 1].id }));
    const focusTime = 1800;
    const rewindTime = 180;
    const track = document.getElementById("track");
    const viewport = document.getElementById("viewport");
    const miniShell = document.getElementById("miniShell");
    const nodesRoot = document.getElementById("nodes");
    const wiresRoot = document.getElementById("wires");
    const brandText = document.getElementById("brandText");
    const brandMark = document.getElementById("brandMark");
    let index = -1;
    let direction = 1;
    let shellScale = 1;

    function render() {
      nodesRoot.innerHTML = nodes.map((node) => `
        <article class="node ${node.status}" id="node-${node.id}" style="left:${node.x}px;top:${node.y}px">
          <div class="node-title">${node.title}</div>
          <p class="node-body">${node.body}</p>
        </article>
      `).join("");

      wiresRoot.innerHTML = links.map((link, linkIndex) => {
        const from = nodes.find((node) => node.id === link.from);
        const to = nodes.find((node) => node.id === link.to);
        const start = { x: from.x + 180, y: from.y + 38 };
        const end = { x: to.x, y: to.y + 38 };
        const bend = Math.min(150, Math.max(50, Math.abs(end.x - start.x) * 0.44));
        const color = linkIndex < 5 ? "var(--mint)" : linkIndex === 6 ? "var(--gold)" : "var(--cyan)";
        return `<path id="wire-${linkIndex}" class="wire" style="stroke:${color};color:${color}" d="M ${start.x} ${start.y} C ${start.x + bend} ${start.y}, ${end.x - bend} ${end.y}, ${end.x} ${end.y}" />`;
      }).join("");
    }

    function setFocus(nextIndex) {
      nodes.forEach((node, nodeIndex) => {
        const el = document.getElementById(`node-${node.id}`);
        el.classList.toggle("revealed", nodeIndex <= nextIndex);
        el.classList.toggle("active", nodeIndex === nextIndex);
      });

      links.forEach((_, linkIndex) => {
        const wire = document.getElementById(`wire-${linkIndex}`);
        wire.classList.toggle("visible", linkIndex < nextIndex);
      });

      const active = nodes[Math.max(0, nextIndex)];
      const target = active ? active.x - viewport.clientWidth * 0.22 : 0;
      const max = track.offsetWidth - viewport.clientWidth;
      track.style.transform = `translateX(${-Math.max(0, Math.min(max, target))}px)`;
    }

    function fitToFrame() {
      const availableWidth = window.innerWidth - 28;
      const availableHeight = window.innerHeight - 24;
      const naturalWidth = 1120;
      const naturalHeight = 310;
      shellScale = Math.min(1, availableWidth / naturalWidth, availableHeight / naturalHeight);
      miniShell.style.transform = `scale(${shellScale})`;
      miniShell.style.height = `${naturalHeight}px`;
    }

    function typeConcept() {
      brandMark.textContent = "PE";
      brandText.textContent = "Playforge Entertainment";
      window.setTimeout(() => {
        brandText.textContent = "PE";
      }, 700);
      window.setTimeout(() => {
        brandText.textContent = "HootQuest";
      }, 1250);
      window.setTimeout(() => {
        brandText.innerHTML = "HootQuest <span class='typed-word'>Concept</span>";
        index = 0;
        setFocus(index);
      }, 1850);
    }

    function finishLoop() {
      brandText.textContent = "PE";
      window.setTimeout(() => {
        brandText.textContent = "Playforge Entertainment";
      }, 700);
    }

    function tick() {
      if (index < 0) {
        typeConcept();
        window.setTimeout(tick, 2500);
        return;
      }

      index += direction;

      if (index >= nodes.length) {
        direction = -1;
        index = nodes.length - 2;
      }

      if (index < 0) {
        direction = 1;
        finishLoop();
        setFocus(-1);
        window.setTimeout(() => {
          typeConcept();
          window.setTimeout(tick, 2500);
        }, 1800);
        return;
      }

      setFocus(index);
      window.setTimeout(tick, direction < 0 ? rewindTime : focusTime);
    }

    window.addEventListener("resize", () => {
      fitToFrame();
      setFocus(index);
    });

    window.addEventListener("load", () => {
      fitToFrame();
      render();
      setFocus(-1);
      tick();
    });
  </script>
</body>
</html>
